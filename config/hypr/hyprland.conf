# PARROT // NIGHT OPS — CachyOS/Hyprland starter
# Review before use; merge with any existing config as needed.
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

monitor = , preferred, auto, 1

general {
  gaps_in = 5
  gaps_out = 12
  border_size = 2
  col.active_border = rgba(00ff99ee) rgba(00b8a8ee) 45deg
  col.inactive_border = rgba(263a35cc)
  layout = dwindle
  resize_on_border = true
}

decoration {
  rounding = 12
  active_opacity = 0.97
  inactive_opacity = 0.92
  shadow { enabled = true; range = 18; render_power = 3; color = rgba(00ff9940) }
  blur { enabled = true; size = 6; passes = 2; xray = false }
}

animations {
  enabled = true
  bezier = nightops, 0.16, 1, 0.3, 1
  animation = windows, 1, 5, nightops, popin 82%
  animation = windowsOut, 1, 4, nightops, popin 82%
  animation = border, 1, 6, default
  animation = fade, 1, 5, default
  animation = workspaces, 1, 5, nightops, slide
}

input {
  follow_mouse = 1
  touchpad { natural_scroll = true; tap-to-click = true; disable_while_typing = true }
}

$mod = SUPER
bind = $mod, RETURN, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, D, exec, $menu
bind = $mod, ESCAPE, exec, night-ops-menu
bind = $mod SHIFT, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exec, night-ops-menu --power
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

exec-once = waybar
exec-once = swaync
